<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LevelUp</title>

  <style>
    /* =====================================================
       LevelUp — V2 skeleton (Phase 1)
       Objetivo: esqueleto estable (desktop + iOS/Android)
       Version: V2-0.000
       ===================================================== */

    :root{
      --version: "V2-0.000";

      /* sizes */
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;

      --gap: 14px;
      --pad: 16px;

      /* header / bottom nav */
      --header-h: 74px;
      --bottom-h: 78px;

      /* colors */
      --bg0: #0b0b0f;
      --bg1: #101017;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --line: rgba(255,255,255,0.14);
      --line2: rgba(255,255,255,0.18);
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.65);
      --muted2: rgba(255,255,255,0.45);
      --gold: #c8a97b;
      --gold2: #a88a62;
      --shadow: 0 18px 55px rgba(0,0,0,0.55);

      /* safe areas */
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);

      /* iOS dynamic viewport helper */
      --app-h: 100dvh;
    }

    @supports not (height: 100dvh){
      :root{ --app-h: 100vh; }
    }

    *{ box-sizing: border-box; }

    html, body{
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 700px at 30% 20%, rgba(200,169,123,0.10), transparent 55%),
                  radial-gradient(1000px 700px at 70% 80%, rgba(120,150,255,0.07), transparent 60%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      overscroll-behavior: none;
    }

    body{
      /* IMPORTANT: don't set overflow hidden globally; we manage per-screen scroll */
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    a, button{ color: inherit; }

    /* Utility */
    .hidden{ display:none !important; }
    .sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }

    /* ===================
       Entry screen
       =================== */
    .entry{
      min-height: var(--app-h);
      display: grid;
      place-items: center;
      padding: calc(var(--pad) + var(--safe-top)) calc(var(--pad) + var(--safe-right)) calc(var(--pad) + var(--safe-bottom)) calc(var(--pad) + var(--safe-left));
    }

    .entryCard{
      width: min(560px, 94vw);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 26px 22px 18px;
      position: relative;
      overflow: hidden;
    }

    .entryCard:before{
      content:"";
      position:absolute; inset:-80px;
      background:
        radial-gradient(420px 220px at 30% 25%, rgba(200,169,123,0.20), transparent 60%),
        radial-gradient(420px 220px at 70% 85%, rgba(120,150,255,0.14), transparent 60%);
      filter: blur(2px);
      pointer-events:none;
    }

    .entryInner{ position:relative; z-index:1; }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .logo{
      width: 112px;
      height: 112px;
      border-radius: 22px;
      border: 1px solid var(--line2);
      background:
        radial-gradient(circle at 30% 30%, rgba(200,169,123,0.35), rgba(0,0,0,0) 55%),
        radial-gradient(circle at 70% 70%, rgba(120,150,255,0.22), rgba(0,0,0,0) 55%),
        rgba(0,0,0,0.25);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .logo span{
      font-weight: 900;
      letter-spacing: .08em;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 6px 22px rgba(0,0,0,0.55);
    }

    .entryTitle{
      text-align:center;
      font-weight: 800;
      letter-spacing: .18em;
      margin: 10px 0 4px;
      text-transform: uppercase;
    }

    .entrySub{
      text-align:center;
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.35;
    }

    .entryActions{
      display:flex;
      justify-content:center;
      gap: 10px;
      margin-top: 6px;
    }

    .btn{
      border: 1px solid var(--line2);
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 14px 22px;
      min-width: 200px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      touch-action: manipulation;
    }

    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,0.08); }
    .btn:active{ transform: translateY(0px) scale(0.99); }

    .versionTag{
      position:absolute;
      left: 0; right: 0;
      bottom: 10px;
      text-align:center;
      color: var(--muted2);
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding-bottom: calc(8px + var(--safe-bottom));
      pointer-events:none;
    }

    /* ===================
       App shell
       =================== */
    .app{
      height: var(--app-h);
      display:flex;
      flex-direction: column;
      padding: calc(var(--safe-top)) calc(var(--safe-right)) calc(var(--safe-bottom)) calc(var(--safe-left));
    }

    .appHeader{
      height: var(--header-h);
      flex: 0 0 auto;
      padding: 12px var(--pad);
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 10px;
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .headerLeft, .headerRight{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .headerLeft{ justify-content:flex-start; }
    .headerRight{ justify-content:flex-end; }

    .brandMini{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      min-width: 0;
    }

    .logoMini{
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--line2);
      background:
        radial-gradient(circle at 30% 30%, rgba(200,169,123,0.34), rgba(0,0,0,0) 55%),
        rgba(0,0,0,0.25);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .logoMini span{
      font-weight: 900;
      font-size: 12px;
      letter-spacing:.06em;
    }

    .brandText{
      font-size: 13px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.78);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 44vw;
    }

    .hbtn{
      border: 1px solid var(--line2);
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      display:flex;
      align-items:center;
      gap: 8px;
      min-width: 0;
      touch-action: manipulation;
    }

    .hbtn span{ white-space: nowrap; }

    .hbtn:active{ transform: scale(0.99); }

    .hicon{
      width: 18px;
      height: 18px;
      display:inline-grid;
      place-items:center;
      opacity: .9;
    }

    .hbtn.small{ padding: 10px 12px; }

    /* Desktop actions */
    .headerActionsDesktop{ display:flex; gap:10px; }

    /* Mobile menu button */
    .menuBtn{ display:none; }

    /* ===================
       Main area
       =================== */
    .appMain{
      flex: 1 1 auto;
      min-height: 0; /* crucial for nested scroll */
      padding: var(--gap) 0;
      display:flex;
    }

    .panel{
      width: 100%;
      margin: 0 var(--pad);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
      display:flex;
      flex-direction: column;
      min-height: 0;
    }

    .panelHead{
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      gap: 10px;
    }

    .panelTitle{
      font-weight: 900;
      letter-spacing:.18em;
      text-transform: uppercase;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
    }

    .panelBody{
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    /* Placeholder cards to test scroll */
    .card{
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
    }

    .card h3{ margin: 0 0 6px; font-size: 18px; }
    .card p{ margin: 0; color: var(--muted); line-height: 1.35; }

    /* ===================
       Bottom nav (mobile)
       =================== */
    .bottomNav{
      display:none;
      position: sticky;
      bottom: 0;
      z-index: 60;
      padding: 10px var(--pad) calc(10px + var(--safe-bottom));
    }

    .bottomPill{
      display:flex;
      gap: 10px;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px;
      box-shadow: var(--shadow);
    }

    .tabBtn{
      flex: 1 1 0;
      padding: 12px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(0,0,0,0.10);
      font-weight: 800;
      letter-spacing: .02em;
      cursor:pointer;
    }

    .tabBtn.active{
      border-color: rgba(200,169,123,0.55);
      background: rgba(200,169,123,0.12);
    }

    /* ===================
       Mobile menu sheet
       =================== */
    .overlay{
      position: fixed;
      inset: 0;
      z-index: 100;
      display:none;
    }

    .overlay.show{ display:block; }

    .overlayBackdrop{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.55);
    }

    .sheet{
      position:absolute;
      left: 12px;
      right: 12px;
      top: calc(var(--safe-top) + 12px);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(20,20,28,0.92);
      box-shadow: 0 24px 80px rgba(0,0,0,0.65);
      overflow:hidden;
    }

    .sheetHead{
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      gap: 10px;
    }

    .sheetTitle{ font-weight: 900; letter-spacing:.14em; text-transform: uppercase; font-size: 13px; color: rgba(255,255,255,0.82); }

    .sheetBody{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sheetBtn{
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px 12px;
      font-weight: 800;
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sheetBtn:active{ transform: scale(0.99); }

    /* ===================
       Responsive rules
       =================== */

    /* Mobile / narrow: hide desktop header actions, show hamburger + bottom nav */
    @media (max-width: 880px){
      :root{ --header-h: 66px; }
      .brandText{ display:none; }
      .headerActionsDesktop{ display:none; }
      .menuBtn{ display:flex; }
      .bottomNav{ display:block; }
      .appMain{ padding-bottom: 0; }
      .panel{ margin: 0 12px; }
    }

    /* Very small: tighter paddings */
    @media (max-width: 420px){
      :root{ --pad: 12px; --gap: 12px; }
      .tabBtn{ font-size: 14px; padding: 12px 8px; }
    }

    /* Desktop: hide bottom nav */
    @media (min-width: 881px){
      .bottomNav{ display:none; }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      *{ transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <!-- Entry screen (no PIN yet: just a button) -->
  <section id="entry" class="entry">
    <div class="entryCard" role="dialog" aria-modal="true" aria-label="Entrada">
      <div class="entryInner">
        <div class="brand">
          <div class="logo" aria-hidden="true"><span>LU</span></div>
        </div>
        <div class="entryTitle">LevelUp</div>
        <p class="entrySub">Fase 1: esqueleto estable para que funcione bien en escritorio y celular.</p>
        <div class="entryActions">
          <button id="btnEnter" class="btn" type="button">Entrar</button>
        </div>
      </div>
      <div class="versionTag" id="entryVersion">V2-0.000</div>
    </div>
  </section>

  <!-- App shell -->
  <section id="app" class="app hidden" aria-label="Aplicación">

    <header class="appHeader" id="appHeader">
      <div class="headerLeft">
        <!-- Mobile hamburger -->
        <button class="hbtn menuBtn" id="btnMenu" type="button" aria-label="Abrir menú">
          <span class="hicon">☰</span>
          <span class="sr">Menú</span>
        </button>

        <!-- Desktop quick actions (left) -->
        <div class="headerActionsDesktop">
          <button class="hbtn" type="button" data-action="presentacion"><span class="hicon">🎥</span><span>Presentación</span></button>
          <button class="hbtn" type="button" data-action="tema"><span class="hicon">🎨</span><span>Tema</span></button>
        </div>
      </div>

      <div class="brandMini" aria-label="Marca">
        <div class="logoMini" aria-hidden="true"><span>LU</span></div>
        <div class="brandText">MISIONES · RETOS · RECOMPENSAS</div>
      </div>

      <div class="headerRight">
        <!-- Desktop quick actions (right) -->
        <div class="headerActionsDesktop">
          <button class="hbtn" type="button" data-action="datos"><span class="hicon">📦</span><span>Datos</span></button>
          <button class="hbtn" type="button" data-action="edicion"><span class="hicon">🔒</span><span>Edición</span></button>
        </div>

        <!-- Placeholder small button (future) -->
        <button class="hbtn small" id="btnVersion" type="button" title="Versión">
          <span class="hicon">⎇</span><span id="hdrVersion">V2-0.000</span>
        </button>
      </div>
    </header>

    <main class="appMain">
      <section class="panel" aria-label="Contenido">
        <div class="panelHead">
          <div class="panelTitle" id="viewTitle">Fichas</div>
          <div style="color:var(--muted2); font-weight:700; font-size:13px;">V2</div>
        </div>
        <div class="panelBody" id="viewBody" tabindex="0">
          <!-- dynamic -->
        </div>
      </section>
    </main>

    <nav class="bottomNav" aria-label="Navegación">
      <div class="bottomPill">
        <button class="tabBtn active" type="button" data-view="fichas">Fichas</button>
        <button class="tabBtn" type="button" data-view="desafios">Desafíos</button>
        <button class="tabBtn" type="button" data-view="eventos">Eventos</button>
        <button class="tabBtn" type="button" data-view="personajes">Personajes</button>
      </div>
    </nav>

  </section>

  <!-- Mobile overlay sheet (menu) -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlayBackdrop" id="overlayBackdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Menú">
      <div class="sheetHead">
        <div class="sheetTitle">Menú</div>
        <button class="hbtn small" id="btnCloseMenu" type="button">✕</button>
      </div>
      <div class="sheetBody">
        <button class="sheetBtn" type="button" data-action="presentacion">🎥 Presentación</button>
        <button class="sheetBtn" type="button" data-action="tema">🎨 Tema</button>
        <button class="sheetBtn" type="button" data-action="datos">📦 Datos</button>
        <button class="sheetBtn" type="button" data-action="edicion">🔒 Edición</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const VERSION = "V2-0.000";

      // Elements
      const entry = document.getElementById('entry');
      const app = document.getElementById('app');
      const btnEnter = document.getElementById('btnEnter');
      const entryVersion = document.getElementById('entryVersion');
      const hdrVersion = document.getElementById('hdrVersion');

      const viewTitle = document.getElementById('viewTitle');
      const viewBody = document.getElementById('viewBody');

      const overlay = document.getElementById('overlay');
      const overlayBackdrop = document.getElementById('overlayBackdrop');
      const btnMenu = document.getElementById('btnMenu');
      const btnCloseMenu = document.getElementById('btnCloseMenu');

      // Init labels
      entryVersion.textContent = VERSION;
      hdrVersion.textContent = VERSION;

      // Basic state
      const state = {
        view: 'fichas'
      };

      // Render placeholders (Phase 1)
      function renderView(){
        const titleMap = {
          fichas: 'Fichas',
          desafios: 'Desafíos',
          eventos: 'Eventos',
          personajes: 'Personajes'
        };
        viewTitle.textContent = titleMap[state.view] || 'LevelUp';

        // Always reset scroll to top when changing view
        viewBody.scrollTop = 0;

        const frag = document.createDocumentFragment();

        const makeCard = (h, p) => {
          const d = document.createElement('div');
          d.className = 'card';
          d.innerHTML = `<h3>${h}</h3><p>${p}</p>`;
          return d;
        };

        if(state.view === 'fichas'){
          frag.appendChild(makeCard('Ficha', 'Placeholder. Aquí irá la ficha del alumno (mobile-first).'));
          for(let i=1;i<=10;i++) frag.appendChild(makeCard('Campo ' + i, 'Contenido de ejemplo para probar scroll en iOS.'));
        }
        if(state.view === 'desafios'){
          frag.appendChild(makeCard('Desafíos', 'Lista de retos con scroll interno.'));
          for(let i=1;i<=12;i++) frag.appendChild(makeCard('Desafío #' + i, 'Descripción corta del reto.'));
        }
        if(state.view === 'eventos'){
          frag.appendChild(makeCard('Eventos', 'Carruseles y tarjetas vendrán después. Por ahora: scroll vertical estable.'));
          for(let i=1;i<=14;i++) frag.appendChild(makeCard('Evento #' + i, 'Bloque de prueba.'));
        }
        if(state.view === 'personajes'){
          frag.appendChild(makeCard('Personajes', 'Vista resumen. En V2: se hará layout móvil limpio.'));
          for(let i=1;i<=14;i++) frag.appendChild(makeCard('Alumno #' + i, 'Resumen (nivel, XP, etc.).'));
        }

        viewBody.replaceChildren(frag);

        // Update bottom nav active
        document.querySelectorAll('.tabBtn').forEach(b => {
          b.classList.toggle('active', b.dataset.view === state.view);
        });
      }

      function openApp(){
        entry.classList.add('hidden');
        app.classList.remove('hidden');
        renderView();
      }

      // Menu overlay helpers
      function openMenu(){
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden','false');
        // Prevent background scroll when overlay open (iOS friendly)
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
      }

      function closeMenu(){
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden','true');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }

      // Events
      btnEnter.addEventListener('click', openApp);

      // bottom nav clicks
      document.addEventListener('click', (e) => {
        const tab = e.target.closest('.tabBtn');
        if(tab){
          state.view = tab.dataset.view || 'fichas';
          renderView();
          return;
        }

        const act = e.target.closest('[data-action]');
        if(act){
          // Phase 1: actions are placeholders
          closeMenu();
          const a = act.dataset.action;
          alert('Acción (placeholder): ' + a + '\nEn V2 se conectará con modales reales.');
          return;
        }
      }, {passive:true});

      // menu open/close
      if(btnMenu){
        btnMenu.addEventListener('click', (e) => { e.preventDefault(); openMenu(); }, {passive:false});
      }
      btnCloseMenu.addEventListener('click', closeMenu);
      overlayBackdrop.addEventListener('click', closeMenu);

      // Close on ESC
      window.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') closeMenu();
      });

      // iOS viewport resize stability: keep CSS var in sync
      function setAppHeight(){
        // Use innerHeight to avoid iOS toolbar weirdness; dVH is supported, but this helps older Safari
        document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));

      // Start at entry
      // (no auto-open)
    })();
  </script>
</body>
</html>
